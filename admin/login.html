<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <title>Admin Login - VIP Numbers</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/portal.css">
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-left"> VIP Numbers Admin Login
        </div>
        <div class="top-bar-right"><span>ADMIN PREVIEW · SAMPLE DATA</span></div>
    </div>

  <header class="navbar auth-navbar"><a class="logo" href="../index.html"><span class="brand-mark" aria-hidden="true">V</span><span>vip<span class="brand-light">numbers</span></span></a><nav><ul class="nav-links"><li><a href="../index.html">Home</a></li><li><a href="../user/browse.html">Browse numbers</a></li><li><a href="login.html">Sign in</a></li></ul></nav></header>
    <main class="admin-section auth-panel" style="max-width: 400px; margin: 0 auto; padding: 3rem 2rem; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; margin-bottom: 2rem; color: var(--primary-color);">Admin Login</h2>
        
        <p class="demo-disclaimer">Static preview only. Admin authentication is not connected. Do not enter a real password.</p>
        <form method="get" data-demo-form style="max-width: 350px; margin: 0 auto;">
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Admin Email</label>
                <input type="email" placeholder="admin@vipnumbers.com" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem;">
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Admin Password</label>
                <input type="password" placeholder="Enter admin password" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem;">
            </div>
            
            <div style="text-align: center; margin-top: 1.5rem;">
                <button type="submit" class="btn-primary" style="width: 100%; padding: 12px;">Sign In</button>
            </div>
            
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: #666;">
                Don't have an account? <a href="register.html" style="color: var(--accent-color);">Register here</a>
            </p>
        </form>
    </main>

    <footer style="margin-top: 0;">
        <div style="background: var(--primary-color); color: white; padding: 2rem; text-align: center;">
            <p>&copy; 2026 VIP Numbers Shop. All rights reserved.</p>
        </div>
    </footer>
    <script src="../js/portal.js" defer></script>
</body>
</html>
